# Sportscut — build, test, provision and deploy.
#
# One pipeline, run on push to main. Order matters: tests gate images, images
# must exist in Artifact Registry before Terraform points Cloud Run at them, and
# the agent is deployed last because it calls the MCP services Terraform creates.

substitutions:
  _REGION: us-central1
  _ENVIRONMENT: dev
  _APP_NAME: sprtz
  _AR_REPO: sprtz-dev-containers
  _TF_STATE_BUCKET: ""
  # Deployment-specific settings. Empty is a working default, but note what each
  # one costs you: with no _IAP_MEMBERS nobody can reach the editor, and with no
  # _CDN_DOMAIN the CDN is HTTP-only, so the HTTPS editor blocks HLS playback as
  # mixed content. Set them on the trigger.
  _IAP_MEMBERS: ""
  _CDN_DOMAIN: ""
  # Editor service name. Overridden away from the default because IAP keeps
  # accessSettings per service name and a stale gcipSettings block could not be
  # cleared on the old one by any means.
  _WEB_SERVICE_NAME: "sportz-agent"

options:
  # No machineType on purpose. E2_HIGHCPU_8 had no capacity in us-south1: a
  # build requesting it was accepted and then sat in PENDING forever with no
  # error, reading as a queue backlog rather than an unavailable machine. The
  # default pool starts immediately, so this stays unset regardless of region.
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  env:
    - "UV_PYTHON=3.12"

timeout: 3600s

steps:

  # ---------- Preflight --------------------------------------------------------
  # Region support is checked before Terraform creates anything, because
  # Firestore's location is immutable and Vertex is not in every region.

  - id: preflight
    name: gcr.io/cloud-builders/gcloud
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        PROJECT_ID=$PROJECT_ID REGION=${_REGION} bash deploy/scripts/preflight.sh

  # ---------- Bootstrap --------------------------------------------------------
  # The state bucket and the container registry must exist before Terraform can
  # initialise or CI can push. Neither can be owned by the apply that needs them.

  - id: bootstrap
    name: gcr.io/cloud-builders/gcloud
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        PROJECT_ID=$PROJECT_ID \
        REGION=${_REGION} \
        APP_NAME=${_APP_NAME} \
        ENVIRONMENT=${_ENVIRONMENT} \
        AR_REPO=${_AR_REPO} \
        bash deploy/scripts/bootstrap.sh

  # ---------- Verify -----------------------------------------------------------

  - id: agent-tests
    name: python:3.12-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet uv
        cd agents
        uv sync --all-groups
        GOOGLE_CLOUD_PROJECT=ci uv run pytest tests/unit -q
        uv run ruff check sprtz_agents

  - id: api-tests
    name: python:3.12-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cd api
        pip install --quiet -r requirements.txt pytest ruff
        ENVIRONMENT=local python -m pytest tests -q
        ruff check app tests

  - id: mcp-tests
    name: python:3.12-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cd mcp
        pip install --quiet -r requirements-dev.txt
        GOOGLE_CLOUD_PROJECT=ci python -m pytest tests -q

  # ---------- Build ------------------------------------------------------------
  # These run in parallel: each waits only on its own test gate.

  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:latest
      - -f
      - api/Dockerfile
      - api

  - id: web-checks
    name: node:22-alpine
    waitFor: ["-"]
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        node --check web/src/app.js
        node --check web/src/i18n.js
        node --check web/src/settings.js
        node --check web/src/sessions.js
        # Parsing is not enough: a missing translation key, a dead element id
        # and an unbound button all parse and fail in a browser.
        node web/check.mjs

  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:latest
      - -f
      - web/Dockerfile
      - web

  - id: build-mcp-catalog
    name: gcr.io/cloud-builders/docker
    waitFor: ["mcp-tests"]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/mcp-catalog:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/mcp-catalog:latest
      - -f
      - mcp/catalog_server/Dockerfile
      - mcp

  - id: build-mcp-media
    name: gcr.io/cloud-builders/docker
    waitFor: ["mcp-tests"]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/mcp-media:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/mcp-media:latest
      - -f
      - mcp/media_server/Dockerfile
      - mcp

  # ---------- Push -------------------------------------------------------------

  - id: push-images
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-api", "build-web", "build-mcp-catalog", "build-mcp-media", "bootstrap"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for image in api web mcp-catalog mcp-media; do
          docker push --all-tags ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/$$image
        done

  # ---------- Provision --------------------------------------------------------

  - id: terraform-apply
    name: hashicorp/terraform:1.9
    waitFor: ["push-images", "preflight", "agent-tests", "api-tests"]
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        cd deploy/terraform

        # The trigger need not define _TF_STATE_BUCKET: the name is
        # deterministic and matches what bootstrap.sh created.
        STATE_BUCKET="${_TF_STATE_BUCKET}"
        if [ -z "$$STATE_BUCKET" ]; then
          STATE_BUCKET="$PROJECT_ID-${_APP_NAME}-${_ENVIRONMENT}-tfstate"
        fi
        echo "state: gs://$$STATE_BUCKET"

        terraform init -input=false \
          -backend-config="bucket=$$STATE_BUCKET" \
          -backend-config="prefix=terraform/${_ENVIRONMENT}"

        set -- -var="project_id=$PROJECT_ID" \
               -var="region=${_REGION}" \
               -var="environment=${_ENVIRONMENT}" \
               -var="app_name=${_APP_NAME}" \
               -var="image_tag=$SHORT_SHA" \
               -var="cdn_domain=${_CDN_DOMAIN}" \
               -var="web_service_name=${_WEB_SERVICE_NAME}"

        # iap_members is a list; build the HCL literal only when it is set, so
        # an empty substitution does not become a list containing "".
        if [ -n "${_IAP_MEMBERS}" ]; then
          MEMBERS=$$(printf '"%s",' $$(echo "${_IAP_MEMBERS}" | tr ',' ' '))
          set -- "$$@" -var="iap_members=[$${MEMBERS%,}]"
        fi

        # bootstrap.sh created the registry outside Terraform, so adopt it into
        # state on the first run. Already-managed is the normal case.
        if ! terraform state show google_artifact_registry_repository.containers >/dev/null 2>&1; then
          echo "adopting the bootstrapped artifact registry"
          terraform import "$$@" \
            google_artifact_registry_repository.containers \
            "projects/$PROJECT_ID/locations/${_REGION}/repositories/${_AR_REPO}" || true
        fi

        terraform apply -input=false -auto-approve "$$@"
        terraform output -json > /workspace/tf_outputs.json

  # ---------- Deploy the agent -------------------------------------------------
  # Last, because the agent's tools are the MCP services Terraform just created.

  - id: deploy-agent
    name: python:3.12-slim
    waitFor: ["terraform-apply"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq jq curl
        pip install --quiet uv

        # The engine is created by the SDK, not Terraform, so everything it
        # needs at runtime is read out of the outputs and passed through.
        tf() { jq -r ".$$1.value // empty" /workspace/tf_outputs.json; }

        DISPLAY_NAME=$$(tf agent_display_name)
        VERTEX_REGION=$$(tf vertex_region)
        AGENT_SA=$$(tf agent_service_account)
        LOGS_BUCKET=$$(tf agent_logs_bucket)

        cd agents
        uv sync --no-dev
        uv export --no-dev --no-hashes --format requirements-txt > requirements.txt

        # These must be present in *this* process, not only in the deployed
        # engine's env: sprtz_agents.agent binds its tool list at import time,
        # and deploy.py imports it to package the agent. Without them the MCP
        # toolsets are silently dropped from the packaged agent and no runtime
        # variable can put them back.
        export MCP_CATALOG_URL="$$(tf mcp_catalog_url)"
        export MCP_MEDIA_URL="$$(tf mcp_media_url)"
        export GOOGLE_CLOUD_PROJECT="$PROJECT_ID"
        export GOOGLE_CLOUD_LOCATION="$$VERTEX_REGION"

        uv run python deployment/deploy.py \
          --project "$PROJECT_ID" \
          --location "$$VERTEX_REGION" \
          --display-name "$$DISPLAY_NAME" \
          --service-account "$$AGENT_SA" \
          --logs-bucket "$$LOGS_BUCKET" \
          --commit "$SHORT_SHA" \
          --env "SPRTZ_MODEL=$$(tf gemini_model)" \
          --env "SPRTZ_EMBEDDING_MODEL=$$(tf embedding_model)" \
          --env "SPRTZ_EMBEDDING_DIMENSIONS=$$(tf embedding_dimensions)" \
          --env "MCP_CATALOG_URL=$$(tf mcp_catalog_url)" \
          --env "MCP_MEDIA_URL=$$(tf mcp_media_url)" \
          --env "UPLOADS_BUCKET=$$(tf uploads_bucket)" \
          --env "MEDIA_BUCKET=$$(tf media_bucket)" \
          --env "HLS_BUCKET=$$(tf hls_bucket)" \
          --env "CDN_BASE_URL=$$(tf cdn_base_url)" \
          --env "GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY=true" \
          --env "OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true"

  - id: summary
    name: gcr.io/cloud-builders/gcloud
    waitFor: ["deploy-agent"]
    entrypoint: python3
    args:
      - -c
      - |
        # python3 rather than jq: the gcloud builder ships python but not jq,
        # and the apt-get that used to install it was suppressed with `|| true`,
        # so a missing jq surfaced as a 127 that failed the whole build after a
        # completely successful deploy.
        import json
        with open("/workspace/tf_outputs.json") as fh:
            out = json.load(fh)
        def v(key):
            return (out.get(key) or {}).get("value", "(unset)")
        line = "-" * 62
        print(line)
        print(" Sportscut deployed")
        print(line)
        for label, key in (
            ("Editor", "web_url"),
            ("API", "api_url"),
            ("CDN", "cdn_base_url"),
            ("Agent", "agent_display_name"),
            ("MCP catalog", "mcp_catalog_url"),
            ("MCP media", "mcp_media_url"),
        ):
            print(f"  {label:<12} {v(key)}")
        print(line)

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/mcp-catalog:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/mcp-media:$SHORT_SHA
