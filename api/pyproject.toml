[project]
name = "sprtz-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "RUF"]
# B008 is FastAPI's whole dependency-injection idiom: Depends(...) in an
# argument default is how routes declare what they need. E501 is handled by the
# formatter's line-length instead.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests insert the package root on sys.path before importing it.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
pythonpath = "."
