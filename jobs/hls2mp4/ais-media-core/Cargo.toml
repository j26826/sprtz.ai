[package]
name = "ais-media-core"
version = "0.1.0"
edition = "2021"

# Shared foundation for the byte-concat HLS tools (`vod-hls2mp4`,
# `live-hls2mp4`): CENC-CBCS decryption + CPIX key exchange, `object_store`
# output targets, and a small retrying HTTP fetch. `gen1fps` is intentionally
# NOT a consumer (it is FFmpeg-based and independent).
[dependencies]
tokio = { version = "1.37", features = ["io-util", "time", "process", "rt", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
aes = "0.8"
cbc = "0.1"
quick-xml = { version = "0.31", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# v5 only: segment ids are DERIVED from (job_id, kind, sequence), never random —
# see notify.rs Identity::segment_id for why determinism is load-bearing here.
uuid = { version = "1", features = ["v5"] }
hex = "0.4"
base64 = "0.22"
anyhow = "1.0"
object_store = { version = "0.10", features = ["aws", "gcp"] }
url = "2.5"
m3u8-rs = "6.0"
chrono = "0.4"
