<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sportscut</title>
  <meta name="description" content="Ask for a moment, an edit, a cut, or a post. The agent watches the match and cuts it." />
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/app-icon-256.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/app-icon-512.png" />
  <link rel="apple-touch-icon" href="/assets/app-icon-256.png" />
  <link rel="stylesheet" href="/ds/styles.css" />
  <link rel="stylesheet" href="/app.css" />
  <script src="/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
</head>
<body>

<!-- IAP authenticates at the edge; this sign-in gives the browser an Identity
     Platform token so it can open Firestore listeners for realtime updates. -->
<div class="signin" id="signin">
  <div class="signin-card">
    <img class="signin-logo" src="/assets/logo-full-black.png" alt="Sportscut" />
    <p data-i18n="signin.blurb">Sign in to analyse a match and cut it into short-form clips.</p>

    <form id="signin-form" style="text-align:left">
      <div class="field" style="margin-bottom:12px">
        <label for="signin-email" data-i18n="signin.email">Email</label>
        <input class="input" id="signin-email" type="email" autocomplete="email" required />
      </div>
      <div class="field" style="margin-bottom:16px">
        <label for="signin-password" data-i18n="signin.password">Password</label>
        <input class="input" id="signin-password" type="password"
               autocomplete="current-password" minlength="6" required />
      </div>
      <button class="btn-solid" id="signin-submit" type="submit"
              style="width:100%;padding:11px" data-i18n="signin.submit">Sign in</button>
    </form>

    <!-- Both the rule and the button stay hidden unless a federated provider is
         actually configured; offering one that is not enabled only ever yields
         auth/operation-not-allowed. Accounts are provisioned in Identity
         Platform, so there is no self-service sign-up. -->
    <div class="signin-alt hidden" id="signin-alt">
      <span></span><span class="field-label" data-i18n="signin.or">or</span><span></span>
    </div>
    <button class="btn-outline hidden" id="google-btn"
            style="width:100%;padding:10px">
      <span data-i18n="signin.google">Continue with Google</span>
    </button>

    <div class="error-note hidden" id="signin-error"></div>
  </div>
</div>


<div class="shell hidden" id="app">

  <header class="app-header">
    <div class="brand">
      <img class="brand-logo" src="/assets/logo-full-black.png" alt="Sportscut" />
    </div>
    <div class="header-context">
      <div class="game-title" id="game-title" data-i18n="header.noMatch">No match loaded</div>
      <div class="context-line" id="context-line" data-i18n="header.uploadToBegin">Upload a recording to begin</div>
    </div>
    <select class="header-select" id="lang-select" aria-label="Language"></select>
    <button class="header-btn" id="new-session" data-i18n="header.newSession">New session</button>
    <button class="header-btn" id="sign-out" data-i18n="header.signOut">Sign out</button>
  </header>

  <div class="scroll" id="scroll">
    <div class="transcript" id="transcript"></div>
  </div>

  <div class="composer">
    <div class="suggestions" id="suggestions"></div>
    <div class="composer-inner">
      <form class="composer-box" id="composer">
        <input class="composer-input" id="draft" autocomplete="off"
               placeholder="Ask for a moment, an edit, a cut, or a post &mdash; e.g. &ldquo;every wing shot in the second half, 30 seconds, vertical&rdquo;" />
        <button class="composer-send" type="submit" id="send" data-i18n="composer.send">Send</button>
      </form>
      <div class="footer-line" id="footer-line">Enter to send &middot; the agent edits the reel in place &mdash; no timeline required</div>
    </div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
