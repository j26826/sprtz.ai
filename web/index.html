<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPRTZ AI</title>
  <meta name="description" content="Ask for a moment, an edit, a cut, or a post. The agent watches the match and cuts it." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23f3f2f2'/><rect x='9' y='9' width='14' height='14' fill='%23ec3013'/></svg>" />
  <link rel="stylesheet" href="/ds/styles.css" />
  <link rel="stylesheet" href="/app.css" />
  <script src="/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
</head>
<body>

<!-- IAP authenticates at the edge; this sign-in gives the browser an Identity
     Platform token so it can open Firestore listeners for realtime updates. -->
<div class="signin" id="signin">
  <div class="signin-card">
    <div class="brand-mark"></div>
    <h1>Sports Agent</h1>
    <p>Sign in to analyse a match and cut it into short-form clips.</p>
    <button class="btn-solid" id="signin-btn" style="padding:11px 18px">Continue with Google</button>
    <div class="error-note hidden" id="signin-error"></div>
  </div>
</div>

<div class="shell hidden" id="app">

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">Sports Agent</div>
    </div>
    <div class="header-context">
      <div class="game-title" id="game-title">No match loaded</div>
      <div class="context-line" id="context-line">Upload a recording to begin</div>
    </div>
    <button class="header-btn" id="new-session">New session</button>
  </header>

  <div class="scroll" id="scroll">
    <div class="transcript" id="transcript"></div>
  </div>

  <div class="composer">
    <div class="suggestions" id="suggestions"></div>
    <div class="composer-inner">
      <form class="composer-box" id="composer">
        <input class="composer-input" id="draft" autocomplete="off"
               placeholder="Ask for a moment, an edit, a cut, or a post &mdash; e.g. &ldquo;every wing shot in the second half, 30 seconds, vertical&rdquo;" />
        <button class="composer-send" type="submit" id="send">Send</button>
      </form>
      <div class="footer-line" id="footer-line">Enter to send &middot; the agent edits the reel in place &mdash; no timeline required</div>
    </div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
