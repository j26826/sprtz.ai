worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;

  # Cloud Run's filesystem is read-only apart from /tmp.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  sendfile      on;
  tcp_nopush    on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's add_header does not merge across levels: a location that declares
    # one of its own inherits none of these. Every location below that sets a
    # header therefore repeats them, which is verbose and is also the only way
    # to keep them. Dropping X-Frame-Options off the document would be a real
    # regression hidden behind a caching change.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /healthz {
      access_log off;
      return 200 '{"status":"ok","service":"sprtz-web"}';
      add_header Content-Type application/json;
    }

    # Runtime config is regenerated on every container start, so it must never
    # be cached or a promoted image would keep pointing at the old environment.
    location = /config.js {
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Cache-Control "no-store, must-revalidate" always;
      expires -1;
    }

    # Brand assets are content-stable within a release and fetched on every cold
    # load, so they keep a long cache. Replacing one means renaming it.
    location /assets/ {
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Cache-Control "public, max-age=2592000" always;
    }

    # Revalidate rather than cache blind. These filenames are stable across
    # releases — nothing here adds a content hash — so an hour of blind caching
    # is an hour of a browser holding the last release's CSS against this
    # release's HTML. That is not hypothetical: a header rule shipped, the
    # server served it, and the page kept the old sizing because the browser
    # never asked.
    #
    # "no-cache" does not mean do not store, it means revalidate first. nginx
    # answers from the ETag with a 304 when nothing changed, so the cost is one
    # conditional request per file per load rather than a re-download.
    location ~* \.(css|js)$ {
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Cache-Control "no-cache" always;
    }

    location / {
      # The document names every other file, so a stale one can point at
      # scripts that are no longer there.
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
