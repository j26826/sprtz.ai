worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;

  # Cloud Run's filesystem is read-only apart from /tmp.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  sendfile      on;
  tcp_nopush    on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /healthz {
      access_log off;
      return 200 '{"status":"ok","service":"sprtz-web"}';
      add_header Content-Type application/json;
    }

    # Runtime config is regenerated on every container start, so it must never
    # be cached or a promoted image would keep pointing at the old environment.
    location = /config.js {
      add_header Cache-Control "no-store, must-revalidate";
      expires -1;
    }

    location ~* \.(css|js)$ {
      expires 1h;
      add_header Cache-Control "public, max-age=3600";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
